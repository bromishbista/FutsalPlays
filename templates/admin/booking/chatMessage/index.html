{% extends 'admin/inc/base.html' %}
{% block content %}
<center><h3>Chat Message List</h3></center>

<div>
    <div class="mb-5"><a href="{% url 'chatMessage_create' %}" class="btn btn-success float-end mx-5" >Add</a>
    </div>
    <div class="container p-5">
        <table class="table table-bordered" style="font-size:18px;">
            <thead>
              <tr>
                <th scope="col">User</th>
                <th scope="col">Futsal</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
    
            <tbody>
            {% for chatMessage in chatMessage %} 
              <tr>
                <td>{{ chatMessage.user }}</td>
                <td>{{ chatMessage.futsal }}</td>
                <td>
                  <button type="button" class="btn btn-warning"><a href="{% url 'chatMessage_edit' chatMessage.pk %}" class="btn btn-warning" >
                    Edit</a></button>
                  <button type="button" class="btn btn-danger"><a href="{% url 'chatMessage_delete' chatMessage.pk %}" class="btn btn-danger">Delete</a></button>
                </td>
             
              </tr>
            {% empty %}
              <li>No chatMessages found.</li>
            {% endfor %}  
            </tbody>
        </table> 
    </div>
</div>
{% endblock content %}
