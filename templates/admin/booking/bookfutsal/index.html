{% extends 'admin/inc/base.html' %}
{% block content %}
<h3 class="text-center">Booking futsal List</h3>

<div>
    <!-- <div class="mb-5"><a href="{% url 'bookfutsal_create' %}" class="btn btn-success float-end mx-5" >Create</a> -->
    </div>
    <div class="container p-5">
        <table class="table table-bordered" style="font-size:18px;">
            <thead>
              <tr>
                <th scope="col">User</th>
                <th scope="col">Futsal</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
    
            <tbody>
            {% for bookfutsal in bookfutsal %} 
              <tr>
                <td>{{ bookfutsal.user }}</td>
                <td>{{ bookfutsal.futsal }}</td>
                <td>
                  <button type="button" class="btn btn-warning"><a href="{% url 'bookfutsal_edit' bookfutsal.pk %}" class="btn btn-warning" >
                    Edit</a></button>
                  <button type="button" class="btn btn-danger"><a href="{% url 'bookfutsal_delete' bookfutsal.pk %}" class="btn btn-danger">Delete</a></button>
                </td>
             
              </tr>
            {% empty %}
              <li>No bookfutsals found.</li>
            {% endfor %}  
            </tbody>
        </table> 
    </div>
</div>
{% endblock content %}
