<!DOCTYPE html>
{% load static %}
{% load socialaccount %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- bootstrap link for css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>
    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css"/>
    <!-- link for fontawesome icon -->
    <script src="https://kit.fontawesome.com/ecd7f2ff6f.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/booking.css' %}">
</head>

<body>
    <section class="booking-footsal">
        <div class="booking-form login-form">
            <div class="login-image login-form1">
                <img src="{% static 'img/sport.png' %}" alt="">
            </div>
            <div class="booking-form-content login-form1">
                <div class="footsal-title">
                    <h2>Sign In Account</h2>
                </div>
                <form action=" " class="login-form" method='POST'>
                    {% csrf_token %}
                    <label for="username">Username</label>
                    <input type="username" name="username"  id='username' required>

                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required>

                    <button class="button" type="submit" name="submit"> Login</button>
                    {% if error_message %}
                        <div class="error-message">{{ error_message }}</div>
                    {% endif %}
                   
                </form>
                <h4 class="text-center pt-5">Sign in with</h4>
                
            </div>
        </div>
    </section>
    <!-- bootstrap Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script>
    {% for message in messages %}
    alertify.set('notifier','position', 'top-right');
    
    alertify.error('{{message}}');

    {% endfor %}
    </script>
</body>
</html>
