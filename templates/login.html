<!DOCTYPE html>
{% load static %}
{% load socialaccount %}
<html lang="en">

<head>
    <meta charset="UTF-9">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- bootstrap link for css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
        <!-- JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>

    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css"/>
    
    <!-- link for fontawesome icon -->
    <script src="https://kit.fontawesome.com/f198b9808e.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/book.css' %}">
</head>

<body>
    
    <section class="book-futsal">
        <div class="book-form login-form11">
            <div class="login-image login-form12">
                <img src="{% static 'img/sign in.jpg' %}" alt="">
            </div>
            <div class="book-form-content login-form12">
                <div class="futsal-title">
                    <h2>Sign In Account</h2>
                </div>
                <form action=" " class="login-form" method='POST'>
                    {% csrf_token %}
                    <label for="username">Username</label>
                    <input type="username" name="username"  id='username' required>

                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required>

                    <button class="button" type="submit" name="submit"> Login</button>
                    {% if error_message %}
                        <div class="error-message">{{ error_message }}</div>
                    {% endif %}
                    <div class="already-acc">
                        <p>Create an account<a href="" style="text-decoration: none;" class="sign-btn">Sign Up</a></p>
                    </div>
                </form>
                <h4 class="text-center pt-5">Sign in with</h4>
                <div class="already-account">
                    <p><a href="" style="text-decoration: none;" class="sign-btn">Forget Password?</a></p>
                </div>
                <div class="signin-with d-flex justify-content-center">
                    <a href=""><i class="fa-brands fa-google"></i>oogle</a>
                    <a href=""><i class="fa-brands fa-facebook"></i>acebook</a>
                </div>
            </div>
        </div>
    </section>

    <!-- bootstrap Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
    crossorigin="anonymous"></script>

    <script>
        
    {% for message in messages %}
    alertify.set('notifier','position', 'top-right');
    
    alertify.error('{{message}}');

    {% endfor %}
    </script>
</body>
</html>
