{% extends 'base.html' %}
{% load static %}
{% block title %}futsal{% endblock title %}
{% block body %}
     <!-- sliders -->
     <section class="foot-search">
        <div class="footsal-section">
            <div class="search-section-form">
                <div class="search-title">
                    <h3>Futsal</h3>
                </div>
            </div>
        </div>
    </section>
    <!-- sliders -->


    <div class="latest-listed-items" style="background-color: aliceblue;">
        <div class="footsal-highlight">
            <div class="foot-match-content">
                <a href="{% url 'futsal'%}">
                    <i class="fa-solid fa-football "></i>
                    <h4>Futsal</h4>
                </a>
            </div>
        </div>
        <div class="footsal-highlight">
            <div class="foot-match-content">
                <a href="{% url 'match_list' %}">
                    <i class="fa-solid fa-home "></i>
                    <h4>Match</h4>
                </a>
            </div>
        </div>
        <div class="footsal-highlight">
            <div class="foot-match-content">
                <a href="{% url 'team' %}">
                    <i class="fa-solid fa-users "></i>
                    <h4>Team</h4>
                </a>
            </div>
        </div>
        <form
                action="{% url 'futsal' %}"
                method="get"
                class="search-footsal"
                style="display:flex;float:right;justify-content: right;align-items: right;"
              >
                {% csrf_token %}
                <div class="footsal-search-main">
                  <div class="form-left footsal-search d-flex">
                    <i class="fa-solid fa-football fa-football1"></i>
                    <input
                      type="text"
                      name="futsalsearch"
                      style="width:88%;margin-right:1cm;border-radius: 5px;border: 1px solid black;"
                      class="form-control"
                      value=""
                      placeholder="Futsal Details"
                    />
                
                <button type="submit" class="footsal-search-btn">Search</button>
                </div>
                </div>
              </form>
    </div>
    
              
    <!-- latest footsal -->
    <section>
        <div class="container latest-footsal">
            <div class="footsal-items">
                <h2>Latest futsals</h2>
                <div class="footsal-item-wrapper">
                    {% for futsal in futsals %}
                    <div class="footsal-item pt-4">
                        <img src="{{futsal.image.url}}" alt="">
                        <h5 style="text-align: center;">{{futsal.name}}</h5>
                        <div class="inner-footsal-items pt-4">
                            <img src="{% static 'img/logof.png' %}" alt="" style="width: 50px; height: 40px;">
                            <a href=""><i class="fa-solid fa-location-dot"></i>{{futsal.location}}</a>
                            <p>Rs. {{futsal.price}}</p>
                            <a href="{% url 'futsal_detail' pk=futsal.pk %}" class="more-info btn btn-sm btn-outline-secondary">More Info</a>   
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        
    </section>
    <!-- latest footsal -->

    {% endblock %}
